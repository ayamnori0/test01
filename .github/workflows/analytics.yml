name: Run US Stock Market Analysis

on:
  schedule:
    # Spustí se od pondělí do pátku ve 21:30 UTC (22:30 středoevropského času)
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # Umožní vám spustit skript kdykoliv ručně jedním kliknutím

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Explicitně povolí zápis do repozitáře
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        persist-credentials: true # Zajistí předání tokenu pro git push

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Analysis Script
      run: python script.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add index.html
        
        # Pokud nejsou žádné změny v index.html, skript bezpečně skončí
        if git diff-index --quiet HEAD; then
          echo "Žádné změny k uložení."
          exit 0
        fi
        
        git commit -m "Auto-update: Nová analýza trhu"
        
        # KLÍČOVÝ KROK: Stáhne případné změny z GitHubu a hladce je sloučí
        git pull --rebase origin main
        
        git push origin main
