name: Run US Stock Market Analysis

on:
  schedule:
    # Runs Monday to Friday at 21:30 UTC (22:30 CET)
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # Allows manual trigger

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        fetch-depth: 0 # Fetches all history so rebase/pull works perfectly

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Analysis Script
      run: python script.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        
        git add index.html
        
        # If no changes were made to index.html, exit gracefully
        if git diff-index --quiet HEAD; then
          echo "No changes detected. Skipping commit."
          exit 0
        fi
        
        git commit -m "Auto-update: Nová analýza trhu"
        
        # Fetch the absolute newest remote state and rebase our index.html on top of it
        git fetch origin main
        git rebase origin/main
        
        # Push the synchronized changes
        git push origin main
   
